version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: farmdirect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmdirect
      POSTGRES_PASSWORD: farmdirect_secret_password
      POSTGRES_DB: farmdirect_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmdirect-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://farmdirect:farmdirect_secret_password@postgres:5432/farmdirect_db?schema=public
      JWT_SECRET: farmdirect_super_secret_jwt_key_2026
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      PLATFORM_COMMISSION_PERCENTAGE: 5
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmdirect-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
